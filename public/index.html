<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SaaS Status Dashboard</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/main.css?v=2" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <p class="eyebrow">EMEA</p>
        <h1>SaaS Status Dashboard</h1>
        <p class="lede">Vendor health and days since the last confirmed incident.</p>
      </header>

      <div id="banner" class="banner banner--hidden" role="status" aria-live="polite"></div>

      <p id="last-updated" class="last-updated">Loading…</p>

      <section class="grid" id="tool-grid" aria-label="Tools"></section>

      <footer class="footer">
        <p>Data refreshes automatically. Polled hourly via GitHub Actions.</p>
      </footer>
    </main>
    <script src="js/dashboard.js?v=2" type="module"></script>
  </body>
</html>
