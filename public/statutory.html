<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Statutory requirements — EMEA Dashboard</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/main.css?v=14" />
  </head>
  <body>
    <main class="page">
      <div class="page-header-sticky" id="page-header-sticky">
        <header class="header header--bar">
          <p class="eyebrow eyebrow--compact">EMEA</p>
          <div class="header__top">
            <h1>Statutory</h1>
            <div class="header__actions">
              <div class="view-select-wrap">
                <label class="sr-only" for="site-view-select">Dashboard view</label>
                <select id="site-view-select" class="view-select" aria-label="Dashboard view"></select>
              </div>
            </div>
          </div>
          <p id="last-updated" class="last-updated last-updated--bar">Loading…</p>
        </header>
      </div>

      <div class="page-intro" id="page-intro">
        <p class="lede" id="statutory-scope">EMEA regulatory reference by country.</p>

        <div class="statutory-toolbar" role="search">
          <label class="statutory-toolbar__field">
            <span class="statutory-toolbar__label">Country</span>
            <input
              id="statutory-search-input"
              class="statutory-toolbar__input"
              type="search"
              placeholder="Search country…"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
          <label class="statutory-toolbar__field">
            <span class="statutory-toolbar__label">Region</span>
            <select id="statutory-region-filter" class="statutory-toolbar__select">
              <option value="all">All regions</option>
              <option value="EU">EU</option>
              <option value="EEA">EEA</option>
              <option value="Non-EU (UK)">United Kingdom</option>
            </select>
          </label>
          <label class="statutory-toolbar__field">
            <span class="statutory-toolbar__label">Focus</span>
            <select id="statutory-domain-filter" class="statutory-toolbar__select">
              <option value="all">All domains</option>
              <option value="privacy">Privacy</option>
              <option value="accessibility">Accessibility</option>
              <option value="finance_promotions">Financial promotions</option>
            </select>
          </label>
        </div>
      </div>

      <section
        class="grid grid--statutory"
        id="statutory-grid"
        aria-label="Statutory requirements by country"
      ></section>

      <footer class="footer">
        <p>
          Data from <code>data/statutory.json</code> (privacy, accessibility, financial promotion rules).
        </p>
      </footer>
    </main>
    <script src="js/statutory.js?v=2" type="module"></script>
  </body>
</html>
