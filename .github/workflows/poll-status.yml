name: Poll status

on:
  schedule:
    # GitHub cron is best-effort; often 5–15+ minutes between runs.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Poll commits with GITHUB_TOKEN do not trigger other workflows (e.g. Pages deploy).
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: poll-status
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Fetch vendor status
        id: fetch
        run: node scripts/poll.mjs

      - name: Commit status data
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/incidents.json
          git commit -m "chore: update status and incident data"
          git push

      - name: Assemble site
        if: steps.fetch.outputs.changed == 'true'
        run: |
          mkdir -p _site
          cp -r public/. _site/
          cp -r data _site/data

      - name: Upload Pages artifact
        if: steps.fetch.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.fetch.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
