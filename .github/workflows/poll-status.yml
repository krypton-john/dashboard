name: Poll status

on:
  schedule:
    # Top of every hour (UTC). Scheduled workflows can be delayed on busy runners.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      send_test_chat_alert:
        description: Post a fake Salesforce test alert to Slack (needs webhook secrets)
        type: boolean
        default: false

# Poll commits with GITHUB_TOKEN do not trigger other workflows (e.g. Pages deploy).
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: poll-status
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Fetch vendor status
        id: fetch
        env:
          ALERTS_ENABLED: ${{ vars.ALERTS_ENABLED }}
          ALERTS_DRY_RUN: ${{ vars.ALERTS_DRY_RUN }}
          CHAT_WEBHOOK_SALESFORCE: ${{ secrets.CHAT_WEBHOOK_SALESFORCE }}
          CHAT_WEBHOOK_GCP: ${{ secrets.CHAT_WEBHOOK_GCP }}
          CHAT_WEBHOOK_PLATFORM: ${{ secrets.CHAT_WEBHOOK_PLATFORM }}
          CHAT_WEBHOOK_PAYMENTS: ${{ secrets.CHAT_WEBHOOK_PAYMENTS }}
        run: node scripts/poll.mjs

      - name: Send test Slack alert
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.send_test_chat_alert == true
        env:
          ALERTS_ENABLED: "true"
          ALERTS_DRY_RUN: "false"
          CHAT_WEBHOOK_SALESFORCE: ${{ secrets.CHAT_WEBHOOK_SALESFORCE }}
          CHAT_WEBHOOK_GCP: ${{ secrets.CHAT_WEBHOOK_GCP }}
          CHAT_WEBHOOK_PLATFORM: ${{ secrets.CHAT_WEBHOOK_PLATFORM }}
          CHAT_WEBHOOK_PAYMENTS: ${{ secrets.CHAT_WEBHOOK_PAYMENTS }}
        run: node scripts/notify.mjs

      - name: Commit status data
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/incidents.json data/alerts.json
          git commit -m "chore: update status and incident data"
          git push

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r public/. _site/
          cp -r data _site/data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
